<title>لوحة الشرف — شاشة المسجد</title>

<style>
html,body{margin:0;height:100%;background:#FFFFFF;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#box{position:relative;overflow:hidden}
#app{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left}


@keyframes fadeA{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeB{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 5px rgba(227,178,60,.35),0 0 40px rgba(227,178,60,.2)}50%{box-shadow:0 0 0 5px rgba(227,178,60,.6),0 0 64px rgba(227,178,60,.35)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.fa{animation:fadeA .7s ease-out}
.fb{animation:fadeB .7s ease-out}
.glow{animation:glow 3s ease-in-out infinite}
.crown{animation:floaty 3s ease-in-out infinite}
.prog{transition:width 1s linear}
@media (prefers-reduced-motion: reduce){.fa,.fb,.glow,.crown{animation:none}.prog{transition:none}}

</style>
